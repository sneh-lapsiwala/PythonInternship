# ADD: rasa_project/config.yml
recipe: default.v1
language: en

pipeline:
- name: WhitespaceTokenizer
- name: LanguageModelFeaturizer
  model_name: "bert"   # You can choose "bert", "roberta", "xlnet", "distilbert" etc. Make sure it's installed.
  model_weights: "rasa/LaBSE"   # Example, you might need to run `pip install transformers`
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
  constrain_similarities: true
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 100
  constrain_similarities: true
- name: FallbackClassifier
  threshold: 0.7   # Confidence threshold for fallback
  ambiguity_threshold: 0.1   # If confidences are too close, trigger fallback

policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 100
- name: TEDPolicy
  max_history: 5
  epochs: 100
  constrain_similarities: true
assistant_id: 20250619-003846-absolute-pit
